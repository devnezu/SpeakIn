<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpeakIn</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 350px;
      min-height: 400px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #f5f5f5;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    h1 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 20px;
      color: #333;
    }

    .config-section {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 12px;
      color: #666;
      margin-bottom: 6px;
      font-weight: 500;
    }

    input[type="text"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      font-family: monospace;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: #4CAF50;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin: 20px 0;
    }

    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    #recordBtn {
      background: #4CAF50;
      color: white;
    }

    #recordBtn:hover {
      background: #45a049;
    }

    #recordBtn.recording {
      background: #f44336;
    }

    #recordBtn.recording:hover {
      background: #da190b;
    }

    #recordBtn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .status {
      padding: 10px;
      border-radius: 4px;
      font-size: 12px;
      margin-bottom: 10px;
      display: none;
    }

    .status.info {
      background: #e3f2fd;
      color: #1976d2;
      display: block;
    }

    .status.error {
      background: #ffebee;
      color: #c62828;
      display: block;
    }

    .status.success {
      background: #e8f5e9;
      color: #2e7d32;
      display: block;
    }

    .transcription {
      margin-top: 20px;
      padding: 15px;
      background: #f9f9f9;
      border-radius: 4px;
      border: 1px solid #e0e0e0;
      min-height: 80px;
      font-size: 14px;
      line-height: 1.6;
      color: #333;
      display: none;
    }

    .transcription.visible {
      display: block;
    }

    .transcription-label {
      font-size: 12px;
      color: #666;
      font-weight: 500;
      margin-bottom: 8px;
    }

    .copy-btn {
      margin-top: 10px;
      background: #2196F3;
      color: white;
      padding: 8px 16px;
      border-radius: 4px;
      font-size: 12px;
      border: none;
      cursor: pointer;
    }

    .copy-btn:hover {
      background: #1976D2;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>SpeakIn</h1>

    <div class="config-section">
      <label for="apiKey">API Key GROQ</label>
      <input type="text" id="apiKey" placeholder="gsk_...">
    </div>

    <div id="status" class="status"></div>

    <div class="controls">
      <button id="recordBtn">Gravar</button>
    </div>

    <div id="transcriptionContainer" class="transcription">
      <div class="transcription-label">Transcrição:</div>
      <div id="transcriptionText"></div>
      <button id="copyBtn" class="copy-btn">Copiar</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
